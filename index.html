<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks with OKR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F0EFF3;
  --paper:#FFFFFF;
  --ink:#1C1C1E;
  --ink-soft:#8E8E93;
  --ink-faint:#C7C7CC;
  --line:#E7E6EA;
  --accent:#4A6FE0;
  --accent-soft:#4A6FE014;
  --accent-fill:#4A6FE00A;
  --danger:#FF3B30;
  --radius:16px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.45;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:620px;margin:0 auto;padding:28px 18px 90px}

/* header */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:2px}
.title-block h1{font-size:1.85rem;font-weight:700;letter-spacing:-0.02em}
.title-block .date{font-size:0.85rem;color:var(--ink-soft);margin-top:2px}
.header-right{display:flex;align-items:center;gap:8px;padding-top:2px}
.sync-pill{
  font-size:0.68rem;font-weight:600;padding:4px 10px;border-radius:99px;
  color:var(--ink-soft);background:var(--paper);white-space:nowrap;
  box-shadow:0 0 0 1px var(--line);
}
.sync-pill.ok{color:var(--accent);background:var(--accent-soft);box-shadow:none}
.sync-pill.err{color:var(--danger);background:#FF3B300F;box-shadow:none}
.icon-btn{
  background:var(--paper);border:none;cursor:pointer;color:var(--ink-soft);
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px var(--line);
}
.icon-btn:hover{color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* progress ring */
.progress-row{display:flex;align-items:center;gap:14px;margin:22px 2px 24px}
.progress-ring-wrap{position:relative;width:52px;height:52px;flex:none}
.progress-ring{width:52px;height:52px;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--line);stroke-width:4.5}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)}
.ring-label{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:0.62rem;font-weight:700;color:var(--accent);
}
.progress-text{display:flex;flex-direction:column;gap:1px}
.progress-text .big{font-size:0.95rem;font-weight:600}
.progress-text .small{font-size:0.78rem;color:var(--ink-soft)}

/* list container: grouped iOS-style sheet */
.list-container{
  background:var(--paper);border-radius:var(--radius);overflow:hidden;
  box-shadow:0 1px 2px rgba(28,28,30,.05), 0 0 0 1px rgba(28,28,30,.03);
}

/* add row, styled as the first row of the sheet */
.add-row{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.add-row .plus-glyph{
  width:22px;height:22px;border-radius:50%;border:1.75px dashed var(--ink-faint);
  display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-faint);font-size:0.95rem;
}
.add-row input{
  flex:1;border:none;background:transparent;font-size:0.95rem;font-family:var(--sans);color:var(--ink);
}
.add-row input:focus{outline:none}
.add-row input::placeholder{color:var(--ink-faint)}
.add-row button{
  border:none;background:transparent;color:var(--accent);font-weight:600;font-size:0.88rem;
  cursor:pointer;padding:4px 6px;flex:none;
}
.add-row button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* todo rows */
.todo{position:relative}
.todo + .todo{border-top:1px solid var(--line)}
.todo-row{display:flex;align-items:center;gap:11px;padding:13px 16px;position:relative;z-index:1}
.todo.dragging{opacity:.4}
.todo.drag-over-top{box-shadow:inset 0 2px 0 0 var(--accent)}
.todo.drag-over-bottom{box-shadow:inset 0 -2px 0 0 var(--accent)}
.drag-handle{
  flex:none;width:14px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-faint);cursor:grab;opacity:0;transition:opacity .15s ease;
}
.todo:hover .drag-handle{opacity:1}
.drag-handle:active{cursor:grabbing}
.todo-progress-bg{
  position:absolute;inset:0;background:var(--accent-fill);
  transform-origin:left;transition:width .4s cubic-bezier(.4,0,.2,1);z-index:0;pointer-events:none;
}

/* circular checkbox */
.todo-check{
  appearance:none;-webkit-appearance:none;width:23px;height:23px;flex:none;
  border:1.75px solid var(--ink-faint);border-radius:50%;cursor:pointer;background:var(--paper);
  position:relative;transition:background .15s ease,border-color .15s ease;
}
.todo-check:checked{background:var(--accent);border-color:var(--accent);animation:pop .28s ease}
.todo-check:checked::after{
  content:'';position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.todo-check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes pop{0%{transform:scale(.75)}55%{transform:scale(1.18)}100%{transform:scale(1)}}

.todo-title{flex:1;font-size:0.95rem;min-width:0;word-wrap:break-word}
.todo.done .todo-title{color:var(--ink-faint);text-decoration:line-through}
.todo-pct{font-size:0.78rem;font-weight:600;color:var(--accent);flex:none;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.todo.done .todo-pct{color:var(--ink-faint)}
.chevron{
  background:none;border:none;cursor:pointer;padding:5px;flex:none;color:var(--ink-faint);
  border-radius:50%;display:flex;transition:transform .2s ease,background .15s ease;
}
.chevron:hover{background:var(--accent-soft);color:var(--accent)}
.chevron:focus-visible{outline:2px solid var(--accent)}
.todo.open .chevron{transform:rotate(90deg)}
.del-btn{
  background:none;border:none;cursor:pointer;padding:5px;flex:none;color:transparent;
  border-radius:50%;display:flex;font-size:1rem;line-height:1;width:26px;height:26px;
  align-items:center;justify-content:center;
}
.todo:hover .del-btn{color:var(--ink-faint)}
.del-btn:hover{color:var(--danger)!important;background:#FF3B300D}
.del-btn:focus-visible{outline:2px solid var(--danger);color:var(--danger)}

/* key results, nested inset panel */
.krs{display:none;padding:2px 16px 14px 49px;position:relative;z-index:1;background:var(--paper)}
.todo.open .krs{display:block}
.kr{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--canvas);border-radius:10px;margin-top:6px}
.kr-name{
  flex:1;min-width:0;border:none;background:transparent;font-family:var(--sans);
  font-size:0.86rem;color:var(--ink);padding:2px 2px;
}
.kr-name:focus{outline:none}
.kr-name::placeholder{color:var(--ink-faint)}
.kr-slider{
  -webkit-appearance:none;appearance:none;flex:none;width:100px;height:4px;border-radius:99px;
  background:var(--line);cursor:pointer;
}
.kr-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.04);cursor:pointer;margin-top:-6.5px;
}
.kr-slider::-moz-range-thumb{
  width:17px;height:17px;border-radius:50%;background:#fff;border:none;
  box-shadow:0 1px 3px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.04);cursor:pointer;
}
.kr-slider::-moz-range-track{height:4px;border-radius:99px;background:var(--line)}
.kr-slider:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.kr-pct{font-size:0.73rem;font-weight:600;color:var(--ink-soft);flex:none;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.kr-del{
  background:none;border:none;cursor:pointer;color:var(--ink-faint);padding:2px 4px;
  border-radius:5px;font-size:0.95rem;line-height:1;flex:none;
}
.kr-del:hover{color:var(--danger)!important}
.add-kr{
  margin-top:8px;background:none;border:none;color:var(--accent);
  font-family:var(--sans);font-size:0.82rem;font-weight:600;padding:6px 2px;cursor:pointer;
}
.add-kr:hover{opacity:.7}
.add-kr:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.kr-empty{font-size:0.8rem;color:var(--ink-faint);padding:8px 2px 2px;font-style:italic}

.empty-state{
  text-align:center;color:var(--ink-soft);font-size:0.88rem;padding:44px 24px;
}

/* settings modal */
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(28,28,30,.4);z-index:50;
  align-items:flex-start;justify-content:center;padding:9vh 20px;backdrop-filter:blur(2px);
}
.modal-bg.show{display:flex}
.modal{
  background:var(--paper);border-radius:18px;max-width:440px;width:100%;
  padding:24px;max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal h2{font-size:1.1rem;margin-bottom:4px;font-weight:700}
.modal .hint{font-size:0.8rem;color:var(--ink-soft);margin-bottom:16px}
.modal label{display:block;font-size:0.72rem;font-weight:700;color:var(--ink-soft);margin:14px 0 5px;text-transform:uppercase;letter-spacing:0.04em}
.modal input{
  width:100%;padding:10px 13px;font-size:0.88rem;font-family:var(--sans);
  border:none;border-radius:10px;background:var(--canvas);color:var(--ink);
}
.modal input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.modal-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.btn{
  padding:9px 16px;font-size:0.85rem;font-weight:600;border-radius:10px;cursor:pointer;
  border:none;background:var(--canvas);color:var(--ink);font-family:var(--sans);
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.subtle:hover{background:var(--line)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:#FF3B300D}
.modal .status-msg{font-size:0.8rem;margin-top:12px;font-weight:600}
.modal .status-msg.ok{color:var(--accent)}
.modal .status-msg.err{color:var(--danger)}
.divider{border:none;border-top:1px solid var(--line);margin:20px 0}
.mode-note{
  font-size:0.78rem;color:var(--ink-soft);background:var(--canvas);
  border-radius:10px;padding:10px 12px;margin-bottom:4px;
}
.mode-note b{color:var(--ink)}

@media (max-width:480px){
  .kr-slider{width:76px}
  .krs{padding-left:16px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Tasks with OKR</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="header-right">
      <span class="sync-pill" id="syncPill">local only</span>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="progress-row" id="progressRow" hidden>
    <div class="progress-ring-wrap">
      <svg class="progress-ring" viewBox="0 0 52 52">
        <circle class="ring-track" cx="26" cy="26" r="21.5"/>
        <circle class="ring-fill" id="ringFill" cx="26" cy="26" r="21.5"/>
      </svg>
      <div class="ring-label" id="ringLabel">0%</div>
    </div>
    <div class="progress-text">
      <span class="big">Overall progress</span>
      <span class="small" id="doneCountText">0 of 0 done</span>
    </div>
  </div>

  <div class="list-container">
    <div class="add-row">
      <span class="plus-glyph">+</span>
      <input type="text" id="newTodo" placeholder="New to-do…" autocomplete="off">
      <button id="addBtn">Add</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<!-- settings modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-label="Settings">
    <h2>GitHub sync</h2>
    <p class="hint">Connect a private repo so your data follows you between your Mac and office PC. Leave blank to keep everything in this browser only.</p>
    <div class="mode-note" id="modeNote"></div>
    <label for="ghUser">GitHub username</label>
    <input type="text" id="ghUser" placeholder="yourusername" autocomplete="off">
    <label for="ghRepo">Data repo name (private)</label>
    <input type="text" id="ghRepo" placeholder="okr-data" autocomplete="off">
    <label for="ghPath">File path in repo</label>
    <input type="text" id="ghPath" placeholder="data.json" autocomplete="off">
    <label for="ghToken">Fine-grained token</label>
    <input type="password" id="ghToken" placeholder="github_pat_…" autocomplete="off">
    <div class="modal-actions">
      <button class="btn primary" id="connectBtn">Save &amp; connect</button>
      <button class="btn subtle" id="closeModal">Close</button>
      <button class="btn danger" id="disconnectBtn">Disconnect</button>
    </div>
    <p class="status-msg" id="connStatus"></p>
    <hr class="divider">
    <div class="modal-actions" style="margin-top:0">
      <button class="btn subtle" id="exportBtn">Export JSON</button>
      <button class="btn subtle" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </div>
</div>

<script>
'use strict';

/* ---------- state ---------- */
let data = { todos: [] };
let sha = null;
let cfg = null;
let openIds = new Set();
let saveTimer = null;
let saving = false;
let dirtyWhileSaving = false;

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const RING_CIRC = 2 * Math.PI * 21.5;

/* ---------- config ---------- */
function loadCfg(){
  try { cfg = JSON.parse(localStorage.getItem('traction_cfg')) || null; } catch(e){ cfg = null; }
}
function saveCfg(){
  if (cfg) localStorage.setItem('traction_cfg', JSON.stringify(cfg));
  else localStorage.removeItem('traction_cfg');
}

/* ---------- local fallback storage ---------- */
function loadLocal(){
  try { data = JSON.parse(localStorage.getItem('traction_data')) || { todos: [] }; }
  catch(e){ data = { todos: [] }; }
}
function saveLocal(){
  localStorage.setItem('traction_data', JSON.stringify(data));
}

/* ---------- base64 helpers ---------- */
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64.replace(/\n/g, ''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

/* ---------- github api ---------- */
function apiUrl(){
  return `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${cfg.path}`;
}
function headers(){
  return {
    'Authorization': 'Bearer ' + cfg.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}
async function ghLoad(){
  const res = await fetch(apiUrl(), { headers: headers() });
  if (res.status === 404) throw new Error('File not found. Check repo name and path, and that data.json exists.');
  if (res.status === 401) throw new Error('Token rejected. Check the token value and expiry.');
  if (res.status === 403) throw new Error('Access denied. Check the token has Contents read/write on this repo.');
  if (!res.ok) throw new Error('GitHub error ' + res.status);
  const j = await res.json();
  sha = j.sha;
  const parsed = JSON.parse(b64decode(j.content));
  data = (parsed && Array.isArray(parsed.todos)) ? parsed : { todos: [] };
}
async function ghSave(){
  const body = {
    message: 'update ' + new Date().toISOString(),
    content: b64encode(JSON.stringify(data, null, 2)),
    sha: sha
  };
  let res = await fetch(apiUrl(), { method: 'PUT', headers: headers(), body: JSON.stringify(body) });
  if (res.status === 409 || res.status === 422){
    const fresh = await fetch(apiUrl(), { headers: headers() });
    if (fresh.ok){
      const j = await fresh.json();
      body.sha = j.sha;
      res = await fetch(apiUrl(), { method: 'PUT', headers: headers(), body: JSON.stringify(body) });
    }
  }
  if (!res.ok) throw new Error('Save failed (' + res.status + ')');
  const j = await res.json();
  sha = j.content.sha;
}

/* ---------- save orchestration ---------- */
function markDirty(){
  saveLocal();
  render();
  if (!cfg){ setPill('local only', ''); return; }
  if (saveTimer) clearTimeout(saveTimer);
  setPill('unsaved…', '');
  saveTimer = setTimeout(doSave, 1200);
}
async function doSave(){
  if (!cfg) return;
  if (saving){ dirtyWhileSaving = true; return; }
  saving = true;
  setPill('saving…', '');
  try {
    await ghSave();
    setPill('synced', 'ok');
  } catch(e){
    setPill('sync error', 'err');
    console.error(e);
  }
  saving = false;
  if (dirtyWhileSaving){ dirtyWhileSaving = false; doSave(); }
}
function setPill(text, cls){
  const p = $('syncPill');
  p.textContent = text;
  p.className = 'sync-pill' + (cls ? ' ' + cls : '');
}

/* ---------- progress math ---------- */
function todoPct(t){
  if (t.done) return 100;
  if (!t.krs || t.krs.length === 0) return null;
  const sum = t.krs.reduce((a, k) => a + (Number(k.pct) || 0), 0);
  return Math.round(sum / t.krs.length);
}
function overallPct(){
  const vals = data.todos.map(t => {
    const p = todoPct(t);
    return p === null ? (t.done ? 100 : 0) : p;
  });
  if (vals.length === 0) return null;
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}
function krGradient(pct){
  return `linear-gradient(to right, var(--accent) ${pct}%, var(--line) ${pct}%)`;
}

/* ---------- render ---------- */
function render(){
  const list = $('list');
  if (data.todos.length === 0){
    list.innerHTML = '<div class="empty-state">Nothing yet. Add a to-do above, then open its arrow to add key results.</div>';
  } else {
    list.innerHTML = data.todos.map(t => {
      const pct = todoPct(t);
      const isOpen = openIds.has(t.id);
      const krsHtml = (t.krs && t.krs.length)
        ? t.krs.map(k => {
            const kp = Number(k.pct) || 0;
            return `
          <div class="kr" data-todo="${t.id}" data-kr="${k.id}">
            <input class="kr-name" value="${esc(k.name)}" placeholder="Key result…" aria-label="Key result name">
            <input class="kr-slider" type="range" min="0" max="100" step="5" value="${kp}" style="background:${krGradient(kp)}" aria-label="Progress for ${esc(k.name)}">
            <span class="kr-pct">${kp}%</span>
            <button class="kr-del" title="Delete key result" aria-label="Delete key result">×</button>
          </div>`;
          }).join('')
        : '<div class="kr-empty">No key results yet.</div>';
      return `
      <div class="todo ${t.done ? 'done' : ''} ${isOpen ? 'open' : ''}" data-id="${t.id}" draggable="true">
        <div class="todo-row">
          <div class="todo-progress-bg" style="width:${pct === null ? 0 : pct}%"></div>
          <span class="drag-handle" title="Drag to reorder">
            <svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="2" r="1.4"/><circle cx="8" cy="2" r="1.4"/><circle cx="2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="2" cy="14" r="1.4"/><circle cx="8" cy="14" r="1.4"/></svg>
          </span>
          <input type="checkbox" class="todo-check" ${t.done ? 'checked' : ''} aria-label="Mark done">
          <span class="todo-title">${esc(t.title)}</span>
          <span class="todo-pct">${pct === null ? '' : pct + '%'}</span>
          <button class="chevron" aria-label="Toggle key results" aria-expanded="${isOpen}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </button>
          <button class="del-btn" title="Delete to-do" aria-label="Delete to-do">×</button>
        </div>
        <div class="krs">
          ${krsHtml}
          <button class="add-kr">+ Add key result</button>
        </div>
      </div>`;
    }).join('');
  }

  const op = overallPct();
  const doneCount = data.todos.filter(t => t.done).length;
  $('progressRow').hidden = (op === null);
  if (op !== null){
    $('ringLabel').textContent = op + '%';
    const ring = $('ringFill');
    ring.style.strokeDasharray = RING_CIRC;
    ring.style.strokeDashoffset = RING_CIRC * (1 - op / 100);
    $('doneCountText').textContent = `${doneCount} of ${data.todos.length} done`;
  }
}

/* ---------- event delegation ---------- */
$('list').addEventListener('click', e => {
  const todoEl = e.target.closest('.todo');
  if (!todoEl) return;
  const t = data.todos.find(x => x.id === todoEl.dataset.id);
  if (!t) return;

  if (e.target.closest('.chevron')){
    openIds.has(t.id) ? openIds.delete(t.id) : openIds.add(t.id);
    render();
  } else if (e.target.closest('.del-btn')){
    if (confirm('Delete this to-do and its key results?')){
      data.todos = data.todos.filter(x => x.id !== t.id);
      openIds.delete(t.id);
      markDirty();
    }
  } else if (e.target.closest('.add-kr')){
    t.krs = t.krs || [];
    t.krs.push({ id: uid(), name: '', pct: 0 });
    openIds.add(t.id);
    markDirty();
    const els = document.querySelectorAll(`.todo[data-id="${t.id}"] .kr-name`);
    if (els.length) els[els.length - 1].focus();
  } else if (e.target.closest('.kr-del')){
    const krEl = e.target.closest('.kr');
    t.krs = t.krs.filter(k => k.id !== krEl.dataset.kr);
    markDirty();
  }
});

$('list').addEventListener('change', e => {
  const todoEl = e.target.closest('.todo');
  if (!todoEl) return;
  const t = data.todos.find(x => x.id === todoEl.dataset.id);
  if (!t) return;

  if (e.target.classList.contains('todo-check')){
    t.done = e.target.checked;
    markDirty();
  } else if (e.target.classList.contains('kr-name')){
    const krEl = e.target.closest('.kr');
    const k = t.krs.find(x => x.id === krEl.dataset.kr);
    if (k){ k.name = e.target.value.trim(); markDirty(); }
  }
});

$('list').addEventListener('input', e => {
  if (!e.target.classList.contains('kr-slider')) return;
  const todoEl = e.target.closest('.todo');
  const krEl = e.target.closest('.kr');
  const t = data.todos.find(x => x.id === todoEl.dataset.id);
  const k = t && t.krs.find(x => x.id === krEl.dataset.kr);
  if (!k) return;
  k.pct = Number(e.target.value);
  e.target.style.background = krGradient(k.pct);
  krEl.querySelector('.kr-pct').textContent = k.pct + '%';
  const pct = todoPct(t);
  todoEl.querySelector('.todo-pct').textContent = pct === null ? '' : pct + '%';
  todoEl.querySelector('.todo-progress-bg').style.width = (pct === null ? 0 : pct) + '%';
  const op = overallPct();
  if (op !== null){
    $('ringLabel').textContent = op + '%';
    const ring = $('ringFill');
    ring.style.strokeDashoffset = RING_CIRC * (1 - op / 100);
  }
  saveLocal();
  if (cfg){ if (saveTimer) clearTimeout(saveTimer); setPill('unsaved…',''); saveTimer = setTimeout(doSave, 1200); }
});

/* ---------- drag to reorder ---------- */
let draggedId = null;

function clearDragIndicators(){
  document.querySelectorAll('.todo.drag-over-top,.todo.drag-over-bottom').forEach(el => {
    el.classList.remove('drag-over-top', 'drag-over-bottom');
  });
}

$('list').addEventListener('dragstart', e => {
  const handle = e.target.closest('.drag-handle');
  const todoEl = e.target.closest('.todo');
  if (!handle || !todoEl){ e.preventDefault(); return; }
  draggedId = todoEl.dataset.id;
  todoEl.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', draggedId); } catch(err){}
});

$('list').addEventListener('dragover', e => {
  if (!draggedId) return;
  e.preventDefault();
  const targetEl = e.target.closest('.todo');
  clearDragIndicators();
  if (!targetEl || targetEl.dataset.id === draggedId) return;
  const rect = targetEl.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  targetEl.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
});

$('list').addEventListener('drop', e => {
  if (!draggedId) return;
  e.preventDefault();
  const targetEl = e.target.closest('.todo');
  clearDragIndicators();
  const fromId = draggedId;
  draggedId = null;
  if (!targetEl || targetEl.dataset.id === fromId) return;
  const rect = targetEl.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  const fromIdx = data.todos.findIndex(t => t.id === fromId);
  if (fromIdx === -1) return;
  const [item] = data.todos.splice(fromIdx, 1);
  let toIdx = data.todos.findIndex(t => t.id === targetEl.dataset.id);
  if (toIdx === -1) toIdx = data.todos.length;
  data.todos.splice(before ? toIdx : toIdx + 1, 0, item);
  markDirty();
});

$('list').addEventListener('dragend', () => {
  draggedId = null;
  clearDragIndicators();
  document.querySelectorAll('.todo.dragging').forEach(el => el.classList.remove('dragging'));
});

/* ---------- add todo ---------- */
function addTodo(){
  const inp = $('newTodo');
  const title = inp.value.trim();
  if (!title) return;
  data.todos.unshift({ id: uid(), title: title, done: false, krs: [] });
  inp.value = '';
  markDirty();
  inp.focus();
}
$('addBtn').addEventListener('click', addTodo);
$('newTodo').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

/* ---------- settings modal ---------- */
function openModal(){
  $('modeNote').innerHTML = cfg
    ? `Currently syncing to <b>${esc(cfg.user)}/${esc(cfg.repo)}</b>.`
    : `Currently in <b>local-only mode</b>: data stays in this browser.`;
  if (cfg){
    $('ghUser').value = cfg.user; $('ghRepo').value = cfg.repo;
    $('ghPath').value = cfg.path; $('ghToken').value = cfg.token;
  } else {
    $('ghPath').value = $('ghPath').value || 'data.json';
  }
  $('connStatus').textContent = '';
  $('modalBg').classList.add('show');
}
$('settingsBtn').addEventListener('click', openModal);
$('closeModal').addEventListener('click', () => $('modalBg').classList.remove('show'));
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg')) $('modalBg').classList.remove('show'); });

$('connectBtn').addEventListener('click', async () => {
  const user = $('ghUser').value.trim();
  const repo = $('ghRepo').value.trim();
  const path = $('ghPath').value.trim() || 'data.json';
  const token = $('ghToken').value.trim();
  const st = $('connStatus');
  if (!user || !repo || !token){
    st.textContent = 'Fill in username, repo and token.'; st.className = 'status-msg err'; return;
  }
  cfg = { user, repo, path, token };
  st.textContent = 'Connecting…'; st.className = 'status-msg';
  try {
    const hadLocalData = data.todos.length > 0;
    const localSnapshot = JSON.parse(JSON.stringify(data));
    await ghLoad();
    if (data.todos.length === 0 && hadLocalData){
      if (confirm('The repo file is empty but this browser has existing to-dos. Upload them to GitHub?')){
        data = localSnapshot;
        await ghSave();
      }
    }
    saveCfg();
    saveLocal();
    render();
    setPill('synced', 'ok');
    st.textContent = 'Connected. Data loaded from GitHub.'; st.className = 'status-msg ok';
  } catch(err){
    cfg = null;
    st.textContent = err.message; st.className = 'status-msg err';
    setPill('local only', '');
  }
});

$('disconnectBtn').addEventListener('click', () => {
  cfg = null;
  saveCfg();
  setPill('local only', '');
  $('ghToken').value = '';
  $('modeNote').innerHTML = 'Currently in <b>local-only mode</b>: data stays in this browser.';
  $('connStatus').textContent = 'Disconnected. Your data stays in this browser.';
  $('connStatus').className = 'status-msg';
});

/* ---------- export / import ---------- */
$('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'traction-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      if (!parsed || !Array.isArray(parsed.todos)) throw new Error();
      if (confirm('Replace current data with the imported file?')){
        data = parsed;
        markDirty();
        $('connStatus').textContent = 'Imported.'; $('connStatus').className = 'status-msg ok';
      }
    } catch(err){
      $('connStatus').textContent = 'Not a valid backup file.'; $('connStatus').className = 'status-msg err';
    }
    e.target.value = '';
  };
  r.readAsText(f);
});

/* ---------- refresh on tab focus ---------- */
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && cfg && !saving && !saveTimer){
    try { await ghLoad(); saveLocal(); render(); setPill('synced','ok'); } catch(e){}
  }
});

/* ---------- init ---------- */
(async function init(){
  $('today').textContent = new Date().toLocaleDateString('en-MY', { weekday:'long', day:'numeric', month:'long' });
  loadCfg();
  loadLocal();
  render();
  if (cfg){
    setPill('loading…', '');
    try {
      await ghLoad();
      saveLocal();
      render();
      setPill('synced', 'ok');
    } catch(e){
      setPill('sync error', 'err');
      console.error(e);
    }
  }
})();
</script>
</body>
</html>
